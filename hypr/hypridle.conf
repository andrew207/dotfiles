general {
    lock_cmd = pidof hyprlock || hyprlock 
    before_sleep_cmd = loginctl lock-session
    # dpms goes through a dispatcher, so under the Lua config it has to be Lua:
    # the payload is evaluated as `hl.dispatch(<payload>)`. exec_raw takes the
    # legacy command text. The loginctl/systemctl lines below are not dispatchers.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.exec_raw("dpms on")'

    # 'dbus inhibit' is when stuff like firefox / steam force the system to stay awake
    # we want to respect their wishes
    ignore_dbus_inhibit = false 
 }

# Screenlock
listener {
    timeout = 600                     
    on-timeout = loginctl lock-session
}

# Turn off screen 
listener {
    timeout = 660                           
    on-timeout = hyprctl dispatch 'hl.dsp.exec_raw("dpms off")'
    on-resume = hyprctl dispatch 'hl.dsp.exec_raw("dpms on")'
}

# Suspend
listener {
    timeout = 3600
    on-timeout = systemctl suspend
}