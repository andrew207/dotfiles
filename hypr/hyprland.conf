# The real config lives in hyprland.lua (Lua entry point). It requires:
#   env.lua, execs.lua, general.lua, colors.lua, rules.lua, keybinds.lua,
#   monitors.lua (+ optional custom/*.lua overrides)
# This file is a comment-only pointer: it must set no options, otherwise it
# loads after the Lua config and clobbers its settings. If deleted, Hyprland
# regenerates an example stub here that overrides hyprland.lua.
